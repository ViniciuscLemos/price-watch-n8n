services:
  api:
    build: .
    ports:
      # the page with every game and its price history
      - "8000:8000"
    environment:
      - STEAM_COUNTRY=${STEAM_COUNTRY:-br}
      - STEAM_PROFILE=${STEAM_PROFILE:-}
    volumes:
      - api-data:/data
      # edit the list without rebuilding
      - ./watchlist.json:/app/watchlist.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s

  n8n:
    image: n8nio/n8n:1.64.0
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # where the deals go: each one is used only when it's filled in, and none of
      # them ends up inside the workflow json
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_APIKEY=${WHATSAPP_APIKEY:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  n8n-data:
