name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose build api

  e2e:
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v5
      - run: bash ci/e2e.sh
      - if: failure()
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml logs; cat ci-out/messages.txt || true
